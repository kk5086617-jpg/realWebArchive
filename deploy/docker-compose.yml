name: webarchive-deploy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webarchive
      POSTGRES_USER: webarchive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create deploy/.env with POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webarchive -d webarchive"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../BackEnd
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY: "1"
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: webarchive
      PGUSER: webarchive
      PGPASSWORD: ${POSTGRES_PASSWORD:?Create deploy/.env with POSTGRES_PASSWORD}
    volumes:
      - ../storage:/app/storage:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ../FrontEnd
      dockerfile: dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "127.0.0.1:80:8080"
      - "127.0.0.1:443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
