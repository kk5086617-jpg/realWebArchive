server {
    listen 8080;
    server_name webarchive.localhost;
    return 301 https://webarchive.localhost$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name webarchive.localhost;
    ssl_certificate /etc/nginx/certs/webarchive.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/webarchive.localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:3001;
        include /etc/nginx/proxy-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /covers/ {
        proxy_pass http://backend:3001;
        include /etc/nginx/proxy-headers.conf;
    }
    location /games/ {
        proxy_pass http://backend:3001;
        include /etc/nginx/proxy-headers.conf;
    }
    location / {
        proxy_pass http://frontend:8080;
        include /etc/nginx/proxy-headers.conf;
    }
}
